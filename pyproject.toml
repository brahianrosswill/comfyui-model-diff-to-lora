[project]
name = "comfyui-model-diff-to-lora"
description = "Bake any chain of LoRAs (and any other model edits) into a single distributable .safetensors LoRA. Load several LoRAs at the strengths you want, run this node, and walk away with one combined LoRA file you can ship anywhere."
version = "1.0.1"
license = "MIT"
authors = [
    { name = "Peter Neill" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/shootthesound/comfyui-model-diff-to-lora"
Repository = "https://github.com/shootthesound/comfyui-model-diff-to-lora"
Issues = "https://github.com/shootthesound/comfyui-model-diff-to-lora/issues"

[tool.comfy]
PublisherId = "shootthesound"
DisplayName = "Model Diff to LoRA"
Icon = ""
